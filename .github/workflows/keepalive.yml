# Supabase 무료 프로젝트는 한동안 요청이 없으면 일시 정지된다.
# 사흘마다 서버의 /health/deep을 불러 데이터베이스를 한 번 조회하고, 실패하면 이 작업이 실패로 표시된다.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the API and database
        env:
          API_URL: ${{ vars.CUE_API_URL || 'https://cue-api-vczh.onrender.com' }}
        run: |
          # Render 무료 서버는 잠들어 있으면 처음 응답까지 1분 가까이 걸린다.
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 90 "$API_URL/health/deep"; then
              exit 0
            fi
            sleep 30
          done
          exit 1
